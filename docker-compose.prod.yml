services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ebd
      POSTGRES_USER: ebd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_ebd:/var/lib/postgresql/data
    # sem "ports": o banco só é alcançável pelos containers da rede ebd_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebd -d ebd"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ebd_net

  app:
    build: .
    restart: always
    environment:
      # O app conecta com um papel COMUM (sem bypass de RLS); migrations e provisionamento usam o dono.
      DATABASE_URL: postgresql+asyncpg://ebd_app:${APP_DB_PASSWORD}@db:5432/ebd
      MIGRATION_DATABASE_URL: postgresql+asyncpg://ebd:${POSTGRES_PASSWORD}@db:5432/ebd
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DOMINIO_BASE: ${DOMINIO_BASE:-}
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      UPLOADS_DIR: /data/uploads
    volumes:
      - ebd_data:/data
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ebd_net

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados e chaves (NÃO apagar: refazer tudo bate no limite do Let's Encrypt)
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - ebd_net

networks:
  ebd_net:
    driver: bridge

volumes:
  pg_ebd:
  ebd_data:
  caddy_data:
  caddy_config:
