services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ebd
      POSTGRES_USER: ebd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_ebd:/var/lib/postgresql/data
    # sem "ports": o banco só é alcançável pelos containers da rede ebd_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebd -d ebd"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ebd_net

  app:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://ebd:${POSTGRES_PASSWORD}@db:5432/ebd
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      UPLOADS_DIR: /data/uploads
    volumes:
      - ebd_data:/data
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ebd_net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - ebd_net

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    networks:
      - ebd_net

networks:
  ebd_net:
    driver: bridge

volumes:
  pg_ebd:
  ebd_data:
  certbot_www:
  certbot_certs:
